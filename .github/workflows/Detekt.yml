name: Detekt

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  # Catches merges done locally and pushed straight to main
  push:
    branches:
      - main
  # Lets the release workflow run it as a sanity check before uploading
  workflow_call:

concurrency:
  # Not github.workflow: when called from another workflow it resolves to the caller's name and would cancel it
  group: detekt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out branch
        uses: actions/checkout@v4
        with:
          # Gradle configuration runs git describe to resolve the version name, which needs the tags
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run detekt
        run: ./gradlew detekt
